<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEGA SYNC v11.17 - FINAL</title>
    <link rel="stylesheet" href="src/index_v16.css">
    <style>
        :root { --primary: #ef4444; --secondary: #1e293b; }
        .emergency-banner { background: #ef4444; color: white; padding: 20px; text-align: center; font-weight: bold; font-size: 1.5rem; position: sticky; top: 0; z-index: 99999; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .btn-mega { background: #ef4444; color: white; padding: 20px 40px; border-radius: 50px; font-size: 1.2rem; font-weight: bold; border: 5px solid white; cursor: pointer; box-shadow: 0 10px 30px rgba(239,68,68,0.5); }
        .btn-mega:hover { transform: scale(1.05); background: #dc2626; }
    </style>
</head>
<body class="bg-slate-50">
    <div class="emergency-banner">🚀 SISTEM AKTIF: VERSI 11.17 (TERPADU)</div>
    
    <div style="padding: 20px; max-width: 1200px; margin: 0 auto;">
        <div style="background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; margin-bottom: 30px;">
            <h1 style="color: var(--secondary); margin-bottom: 10px;">REKONSILIASI KEUANGAN TERPADU</h1>
            <p style="color: #64748b; margin-bottom: 30px;">Membersihkan data overpaid, sulam, tumbal, dan biaya operasional secara otomatis.</p>
            
            <div style="margin-bottom: 30px; display: flex; justify-content: center; gap: 10px; align-items: center;">
                <label style="font-weight: bold;">Pilih Order:</label>
                <select id="selOrder" style="padding: 12px; border-radius: 10px; border: 2px solid #ddd; width: 400px; font-weight: bold;">
                    <option value="">-- Loading Data... --</option>
                </select>
            </div>

            <button id="btnMegaSync" class="btn-mega">⚡ JALANKAN MEGA-SYNC v11.17 SEKARANG</button>
        </div>

        <div id="statsGrid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px;">
            <!-- Stats will appear here -->
        </div>

        <div style="background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05);">
            <h2 style="margin-bottom: 20px; border-left: 5px solid #ef4444; padding-left: 15px;">Daftar Kelebihan Bayar</h2>
            <div id="tableOverpaid" style="width: 100%; overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="background: #f8fafc; text-align: left;">
                            <th style="padding: 15px; border-bottom: 2px solid #eee;">ID Order</th>
                            <th style="padding: 15px; border-bottom: 2px solid #eee;">Konsumen</th>
                            <th style="padding: 15px; border-bottom: 2px solid #eee;">Total Deal</th>
                            <th style="padding: 15px; border-bottom: 2px solid #eee;">Terbayar</th>
                            <th style="padding: 15px; border-bottom: 2px solid #eee;">Kelebihan</th>
                        </tr>
                    </thead>
                    <tbody id="bodyOverpaid">
                        <tr><td colspan="5" style="text-align:center; padding:50px; color:#94a3b8;">Klik tombol merah di atas untuk memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { syncAllBalances, renderList, renderStats } from './src/terima_pelunasan_v1117.js?v=11.17_FORCE';
        
        window.syncAllBalances = syncAllBalances;

        document.getElementById('btnMegaSync').onclick = async () => {
            const btn = document.getElementById('btnMegaSync');
            btn.disabled = true;
            btn.innerHTML = '⏳ SEDANG PROSES...';
            try {
                await syncAllBalances();
                await renderStats();
                await renderList();
                btn.innerHTML = '✅ BERHASIL SINKRON!';
                setTimeout(() => { btn.innerHTML = '⚡ JALANKAN MEGA-SYNC v11.17 SEKARANG'; btn.disabled = false; }, 3000);
            } catch (e) {
                alert("Error: " + e.message);
                btn.disabled = false;
                btn.innerHTML = '⚡ JALANKAN MEGA-SYNC v11.17 SEKARANG';
            }
        };

        // Load Initial
        setTimeout(async () => {
            await renderStats();
            await renderList();
        }, 1000);
    </script>
</body>
</html>
