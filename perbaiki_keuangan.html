<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PERBAIKI KEUANGAN v11.18 - FINAL</title>
    <link rel="stylesheet" href="src/index_v16.css">
    <style>
        :root { --primary: #ef4444; --secondary: #1e293b; }
        .emergency-banner { background: #ef4444; color: white; padding: 15px; text-align: center; font-weight: bold; position: sticky; top: 0; z-index: 9999; }
    </style>
</head>
<body class="bg-slate-50">
    <div class="emergency-banner">🚀 SISTEM KEUANGAN TERPADU v11.18 - FINAL FIXED</div>
    
    <div style="padding: 20px; max-width: 1200px; margin: 0 auto;">
        <div style="background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); margin-bottom: 25px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div class="page-title">💳 Perbaikan Keuangan <span style="font-size:0.6rem; background:#ef4444; color:white; padding:2px 6px; border-radius:4px; margin-left:8px; vertical-align:middle;">[VERSI 11.19 - TERPADU FINAL]</span></div>
                <button id="btnSync" style="background:var(--primary); color:white; border:none; padding:12px 25px; border-radius:8px; font-weight:bold; cursor:pointer;">
                    🔄 SINKRON SEMUA DATA
                </button>
            </div>
            
            <div style="display: flex; gap: 15px; align-items: center;">
                <label>Pilih Order:</label>
                <select id="selOrder" style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-weight: bold;">
                    <option value="">-- Memuat Daftar Order... --</option>
                </select>
            </div>
        </div>

        <div style="background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">
            <h3 style="margin-top:0; color:#ef4444;">⚠️ Daftar Kelebihan Bayar</h3>
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="background: #f8fafc; text-align: left;">
                        <th style="padding: 12px; border-bottom: 1px solid #eee;">ID</th>
                        <th style="padding: 12px; border-bottom: 1px solid #eee;">Konsumen</th>
                        <th style="padding: 12px; border-bottom: 1px solid #eee;">Deal</th>
                        <th style="padding: 12px; border-bottom: 1px solid #eee;">Paid</th>
                        <th style="padding: 12px; border-bottom: 1px solid #eee;">Kelebihan</th>
                    </tr>
                </thead>
                <tbody id="bodyOverpaid">
                    <tr><td colspan="5" style="text-align:center; padding:30px;">Silakan klik tombol Sinkron di atas...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="src/layout_v53.js?v=11.19_FINAL"></script>
    <script type="module">
        import { syncAllBalances, renderList } from './src/terima_pelunasan_v1119.js?v=11.19_FINAL';
        
        const btn = document.getElementById('btnSync');
        btn.onclick = async () => {
            alert("Sistem sedang loading kode baru (v11.19). Tunggu 5 detik lalu klik lagi. Jika tetap muncul pesan ini, Logout lalu Login lagi.");
            btn.disabled = true;
            btn.innerText = '⌛ SEDANG PROSES...';
            await syncAllBalances();
            await renderList();
            btn.disabled = false;
            btn.innerText = '✅ SINKRON BERHASIL!';
            setTimeout(() => btn.innerText = '🔄 SINKRON SEMUA DATA', 3000);
        };

        // Initial Load
        setTimeout(async () => {
            await renderList();
        }, 500);
    </script>
</body>
</html>
