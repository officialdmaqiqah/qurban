<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Perbaikan Data - Qurban Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; padding: 40px; }
        .card { background: #1e293b; border-radius: 12px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 600px; margin: auto; }
        h1 { color: #38bdf8; margin-top: 0; }
        .item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 20px; font-size: 1rem; }
        .btn:hover { background: #2563eb; }
        #log { margin-top: 20px; font-family: monospace; font-size: 0.8rem; color: #94a3b8; max-height: 200px; overflow-y: auto; border-top: 1px solid #334155; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🛠️ Perbaikan Data Saldo</h1>
        <p>Halaman ini akan memaksa transaksi berikut menjadi LUNAS:</p>
        <div id="list">
            <div class="item"><span>TRX00030</span> <span id="status-TRX00030">Menunggu...</span></div>
            <div class="item"><span>TRX00031</span> <span id="status-TRX00031">Menunggu...</span></div>
            <div class="item"><span>TRX00023</span> <span id="status-TRX00023">Menunggu...</span></div>
        </div>
        <button class="btn" onclick="startFix()">Mulai Perbaikan Sekarang!</button>
        <div id="log"></div>
    </div>

    <script>
        const supabaseUrl = 'https://juscihvfmgibmrhmclab.supabase.co';
        const supabaseKey = 'sb_publishable_K6phM9DpcT4aqm1nvXdkYA_h9N1fQTQ';
        // Perbaikan: Pakai nama 'client' supaya tidak bentrok dengan global 'supabase'
        const client = supabase.createClient(supabaseUrl, supabaseKey);

        function log(msg) {
            const div = document.getElementById('log');
            if (div) {
                div.innerHTML += `<div>> ${msg}</div>`;
                div.scrollTop = div.scrollHeight;
            }
        }

        async function startFix() {
            log("Memulai koneksi ke database...");
            const ids = ['TRX00030', 'TRX00031', 'TRX00023'];
            
            for (const id of ids) {
                const statusEl = document.getElementById(`status-${id}`);
                if (statusEl) statusEl.innerHTML = '⚡ Memproses...';
                log(`Mencari data ${id}...`);

                try {
                    // 1. Ambil data asli
                    const { data: trx, error: fetchErr } = await client.from('transaksi').select('id, total_deal').eq('id', id).maybeSingle();
                    
                    if (fetchErr) throw fetchErr;
                    if (!trx) {
                        if (statusEl) statusEl.innerHTML = '❌ Tidak Ditemukan';
                        log(`[${id}] Data tidak ditemukan di tabel transaksi.`);
                        continue;
                    }

                    log(`[${id}] Ditemukan. Harga: ${trx.total_deal}. Memulai update...`);

                    // 2. Update status jadi Lunas
                    const { error: upErr } = await client.from('transaksi').update({
                        total_paid: trx.total_deal,
                        total_overpaid: 0,
                        updated_at: new Date().toISOString()
                    }).eq('id', id);

                    if (upErr) throw upErr;

                    if (statusEl) statusEl.innerHTML = '✅ BERHASIL';
                    log(`[${id}] Sukses diperbarui menjadi lunas.`);
                } catch (err) {
                    if (statusEl) statusEl.innerHTML = '⚠️ ERROR';
                    log(`[${id}] Gagal: ${err.message}`);
                }
            }
            log("Pekerjaan selesai.");
            alert("Selesai! Silakan cek kembali di aplikasi utama om.");
        }
    </script>
</body>
</html>
